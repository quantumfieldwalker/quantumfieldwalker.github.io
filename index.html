<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quantum Field Walker</title>
<style>
  :root{--neon:#7df9ff;--neon-dim:#66d9ff;--bg1:#02131c;--bg2:#000000}
  html,body{height:100%;margin:0}
  body{font-family:Arial;background:radial-gradient(circle at center,var(--bg1) 0%,var(--bg2) 70%);color:var(--neon);text-align:center}
  .container{padding:56px 20px;max-width:720px;margin:0 auto}
  .title{font-size:44px;margin:0 0 6px;letter-spacing:2px;text-shadow:0 0 10px #00f0ff,0 0 20px #00f0ff,0 0 40px #00f0ff}
  .subtitle{color:var(--neon-dim);margin:6px 0 14px;font-size:15px;opacity:0.95}
  .youtube-link{color:var(--neon-dim);margin-bottom:22px;display:block;text-decoration:none;word-break:break-all;font-size:15px}
  .mandala-box{white-space:pre;font-family:monospace;font-size:14px;line-height:16px;display:inline-block;margin:28px auto;padding:18px 22px;color:var(--neon);text-shadow:0 0 10px #00f0ff,0 0 20px #00f0ff;border-radius:8px;background:rgba(0,0,0,0.04);max-width:520px}
  .enter-btn{display:inline-block;margin-top:22px;padding:16px 34px;font-size:18px;color:black;background:linear-gradient(90deg,#00f0ff,#7df9ff);border-radius:14px;text-decoration:none;box-shadow:0 0 15px #00f0ff,0 0 30px #00f0ff}
  .footer{margin-top:46px;font-size:13px;color:var(--neon-dim);opacity:0.85}
  a.plain{color:inherit;text-decoration:none}
</style>
</head>
<body>
  <div class="container">
    <div class="title">Quantum Field Walker</div>
    <div class="subtitle">A copyrighted work • Free to read</div>

    <a class="youtube-link plain" href="https://youtube.com/@QuantumFieldWalker" target="_blank" rel="noopener noreferrer">
      https://youtube.com/@QuantumFieldWalker
    </a>

    <div class="mandala-box" aria-hidden="true">
       . .  +  . .
       . +  *  + .
       + *  +  * +
       . +  *  + .
       . .  +  . .
    </div>

    <div>
      <a class="enter-btn" href="https://quantumfieldwalker.github.io/quantum-field-walker-book.pdf" target="_blank" rel="noopener noreferrer">
        ENTER AND READ
      </a>
    </div>

    <div class="footer">
      This work is protected. Reading is permitted. Redistribution is not. © 2026 Quantum Field Walker
    </div>
  </div>
</body>
</html>
