<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050d0f;
    color: #d9efe8;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    overflow-x: hidden;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .stars { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .stars span {
    position: absolute; background: white; border-radius: 50%;
    animation: twinkle var(--d, 4s) infinite alternate ease-in-out;
    animation-delay: var(--dl, 0s);
  }
  @keyframes twinkle { from { opacity: 0.1; } to { opacity: 0.8; } }
  .fol {
    position: fixed; top: -70px; left: 50%; transform: translateX(-50%);
    width: 560px; max-width: 120vw; opacity: 0.15; z-index: 1; pointer-events: none;
  }
  .container {
    position: relative; z-index: 2; max-width: 640px; margin: 0 auto;
    padding: 70px 24px 60px; display: flex; flex-direction: column; align-items: center;
  }
  .lantern-sigil {
    filter: drop-shadow(0 0 10px rgba(201,168,76,0.5));
    margin-bottom: 24px; animation: fadeUp 1s 0.2s both ease-out;
  }

  /* ===== QUANTUM TITLE — living gradient sheen ===== */
  .qtitle {
    font-family: 'Cinzel Decorative', Georgia, serif;
    font-size: clamp(34px, 8.5vw, 60px); font-weight: 700;
    color: #e8cf82; /* safety fallback: solid gold if gradient text unsupported */
    letter-spacing: 3px; line-height: 1.22; margin-bottom: 14px;
    background: linear-gradient(100deg,
      #e8cf82 0%, #fff6d8 18%, #ffffff 30%, #3abfcc 42%,
      #fff6d8 54%, #e8cf82 70%, #fff6d8 86%, #ffffff 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 26px rgba(255,246,216,0.25);
    animation: fadeUp 1s 0.4s both ease-out, sheen 7s linear infinite;
  }
  @keyframes sheen {
    0%   { background-position: 0% 0; }
    100% { background-position: 300% 0; }
  }

  .tagline {
    font-style: italic; font-size: 22px; color: #3abfcc; letter-spacing: 2px;
    margin-bottom: 12px; animation: fadeUp 1s 0.6s both ease-out;
  }
  .password {
    font-size: 18px; color: #c9a84c; letter-spacing: 2px;
    margin-bottom: 26px; animation: fadeUp 1s 0.8s both ease-out;
  }
  .intro {
    font-style: italic; font-size: 21px; color: #3abfcc; line-height: 1.65;
    max-width: 500px; margin-bottom: 34px; animation: fadeUp 1s 0.9s both ease-out;
  }
  .divider {
    width: 110px; height: 1px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    margin-bottom: 20px; animation: fadeUp 1s 1s both ease-out;
  }
  .scroll-cue {
    font-size: 22px; color: #c9a84c; margin-bottom: 36px;
    animation: fadeUp 1s 1.05s both ease-out, bob 2.2s 1.6s infinite ease-in-out;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); opacity:0.5; } 50% { transform: translateY(6px); opacity:1; } }

  /* ===== BUTTONS — GOLD title · TEAL subtext ===== */
  .read-btn {
    display: block; width: 100%; max-width: 450px; padding: 32px 28px;
    background: linear-gradient(135deg, rgba(201,168,76,0.07), rgba(58,191,204,0.05));
    border: 1px solid rgba(201,168,76,0.3); border-radius: 4px;
    text-decoration: none; color: inherit; transition: all 0.35s ease;
    margin-bottom: 24px; animation: fadeUp 1s 1.1s both ease-out;
  }
  .read-btn:hover {
    border-color: #c9a84c; box-shadow: 0 0 40px rgba(201,168,76,0.15);
    transform: translateY(-3px);
  }
  .read-btn:focus-visible {
    outline: 2px solid #c9a84c; outline-offset: 3px;
    border-color: #c9a84c;
  }
  .read-btn.lll  { animation-delay: 1.25s; }
  .read-btn.shield { animation-delay: 1.4s; }
  .read-btn.yt-btn { animation-delay: 1.5s; margin-bottom: 50px; }
  .read-btn:hover .btn-arrow { transform: translateX(6px); }

  .btn-eyebrow {
    font-family: 'Cinzel Decorative', Georgia, serif; font-size: 13px; letter-spacing: 3px;
    color: #c9a84c; text-transform: uppercase; margin-bottom: 10px;
  }
  .btn-title { font-size: 29px; color: #e8d9a0; margin-bottom: 9px; font-weight: 500; }
  .btn-sub { font-style: italic; font-size: 18px; color: #3abfcc; font-weight: 400; margin-bottom: 16px; }
  .btn-badge {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #c9a84c; border: 1px solid rgba(201,168,76,0.45);
    padding: 6px 16px; border-radius: 20px; margin-bottom: 14px; line-height: 1.5;
  }
  .btn-arrow { font-size: 26px; color: #c9a84c; display: block; transition: transform 0.3s; }

  .lanterns { display: flex; gap: 12px; justify-content: center; margin: 40px 0 10px; animation: fadeUp 1s 1.5s both ease-out; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    box-shadow: 0 0 8px currentColor, 0 0 16px currentColor;
    animation: pulse 3s infinite alternate ease-in-out; animation-delay: var(--dl, 0s);
  }
  @keyframes pulse { from { opacity: 0.4; transform: scale(0.85); } to { opacity: 1; transform: scale(1.15); } }

  .l2 { background:#ff8c00; color:#ff8c00; --dl:0.3s; }
